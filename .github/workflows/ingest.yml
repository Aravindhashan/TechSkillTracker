name: ingest-jobs

on:
  schedule:
    # Every 6 hours. 4 runs/day keeps the free 200-request JSearch quota
    # comfortable (about 120 searches per 30-day month).
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: ingest-jobs
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ingest.txt

      - name: Run tests
        run: python -m pytest tests -q

      - name: Ingest job postings
        env:
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JSEARCH_COUNTRY: ${{ vars.JSEARCH_COUNTRY || 'in' }}
          JSEARCH_QUERIES: ${{ vars.JSEARCH_QUERIES || 'software developer' }}
          JSEARCH_NUM_PAGES: ${{ vars.JSEARCH_NUM_PAGES || '1' }}
          ENABLE_JOBSPY: "true"
          ENABLE_SKILL_EMBEDDINGS: "false"
        run: python -m modules.ingestion --json

      - name: Report result
        if: always()
        run: echo "Ingestion finished with status ${{ job.status }}"
